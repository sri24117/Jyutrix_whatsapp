name: Reliability checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jyutrix_test
          POSTGRES_USER: jyutrix
          POSTGRES_PASSWORD: testonly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jyutrix -d jyutrix_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://jyutrix:testonly@localhost:5432/jyutrix_test
      - run: node --check frontend/app.js
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --ignore-scripts
      - run: python scripts/ui_smoke.py
